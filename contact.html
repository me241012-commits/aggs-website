<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUCKLAND GIRLS’ GRAMMAR SCHOOL</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>

    <header>
        <div class="header-top">
            <img class="logo" src="images/aggs logo.png" alt="School Logo">
            <h1>AUCKLAND GIRLS’ GRAMMAR SCHOOL</h1>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <div class="hero">
        <img src="images/aggs.jpg" alt="School Building">
        <h2>Contact Auckland Girls' Grammar School</h2>
        <p class="subtitle">WE'D LOVE TO HEAR FROM YOU</p>
    </div>

    <div class="info-section">
        <div class="contact-box">

            <form action="https://formsubmit.co/me241012@students.aggs.school.nz" method="POST">

                <h3>Contact Us</h3>

                <label>Name</label>
                <input type="text" name="name" required>

                <label>Email</label>
                <input type="email" name="email" required>

                <label>Message</label>
                <textarea name="message" required></textarea>

                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_next" value="thankyou.html">

                <button type="submit" class="button">Send message</button>

            </form>

        </div>
    </div>

    <div class="gallery">
        <h3>Our School Gallery</h3>
        <div class="gallery-row">
            <div class="gallery-img" style="background-image:url('images/aggs.jpg')"></div>
            <div class="gallery-img" style="background-image:url('images/aggs.jpg')"></div>
            <div class="gallery-img" style="background-image:url('images/aggs.jpg')"></div>
            <div class="gallery-img" style="background-image:url('images/aggs.jpg')"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Auckland Girls' Grammar School</p>
    </footer>

</body>
</html>
